# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
CONFIG_ZMK_DISPLAY=n
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_GATT_AUTO_SEC_REQ=n

# Nosta lähetystehoa — auttaa sekä host- että split-linkkiä, virrankulutus ~olematon
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sisäinen 32kHz RC-oskillaattori — kiertää viallisen kiteen (diagnostiikka)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
